<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ধন্যবাদ! অর্ডার সম্পন্ন | {brand}</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#C8305F">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Jost:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shop.css">
</head>
<body data-page="thanks">

<header class="site-header">
  <div class="wrap">
    <a class="logo" href="index.html" data-brand>[BRAND NAME]</a>
    <a class="header-call" href="#" data-tel><span data-phone></span></a>
  </div>
</header>

<main class="wrap">
  <div class="thanks reveal">
    <div class="check-circle" aria-hidden="true">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m5 12 5 5L20 7"/></svg>
    </div>
    <h1 style="font-size:30px">জাযাকাল্লাহু খাইরান!</h1>
    <p style="font-size:18px;margin-top:8px">আপনার অর্ডারটি আমরা পেয়েছি।</p>
    <div>অর্ডার আইডি</div>
    <div class="order-id" data-order-id></div>

    <div class="panel" data-thanks-summary hidden></div>

    <p style="font-size:18px;font-weight:600;color:var(--green-dark)">আমাদের প্রতিনিধি শীঘ্রই কল করে অর্ডার কনফার্ম করবেন।</p>
    <p class="hint">অনুগ্রহ করে ফোনটি কাছে রাখুন। দ্রুত কনফার্ম করতে চাইলে WhatsApp-এ মেসেজ দিন।</p>

    <div style="display:grid;gap:12px;margin-top:20px">
      <a class="btn wa block" href="#" data-wa-order>WhatsApp-এ অর্ডার কনফার্ম করুন</a>
      <a class="btn outline block" href="index.html">হোমপেজে ফিরে যান</a>
    </div>
  </div>
</main>

<script src="config.js"></script>
<script src="shop.js" defer></script>
</body>
</html>
