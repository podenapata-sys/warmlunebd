<!doctype html>
<html lang="bn" data-doc-title="doc.thanks">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ধন্যবাদ! অর্ডার সম্পন্ন | {brand}</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#C8305F">
<link rel="icon" href="img/favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="img/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Jost:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shop.css">
</head>
<body data-page="thanks">

<header class="site-header">
  <div class="wrap">
    <a class="logo" href="index.html" aria-label="WarmLune"><img src="img/logo-mark.png" alt="" width="40" height="40" class="logo-img"><img src="img/logo-wordmark.png" alt="WarmLune" width="132" height="16" class="logo-word"></a>
<div class="lang" role="group" aria-label="ভাষা" data-i18n-aria="aria.lang"><button type="button" data-lang="en" aria-pressed="false">EN</button><button type="button" data-lang="bn" aria-pressed="true" class="on">বাংলা</button></div>
    <a class="header-call" href="#" data-tel><span data-phone></span></a>
  </div>
</header>

<main class="wrap">
  <div class="thanks reveal">
    <div class="check-circle" aria-hidden="true">
      <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="m5 12 5 5L20 7"/></svg>
    </div>
    <h1 style="font-size:30px" data-i18n="ty.title">জাযাকাল্লাহু খাইরান!</h1>
    <p style="font-size:18px;margin-top:8px" data-i18n="ty.received">আপনার অর্ডারটি আমরা পেয়েছি।</p>
    <div data-i18n="ty.orderId">অর্ডার আইডি</div>
    <div class="order-id" data-order-id></div>

    <div class="panel" data-thanks-summary hidden></div>

    <p style="font-size:18px;font-weight:600;color:var(--green-dark)" data-i18n="ty.call">আমাদের প্রতিনিধি শীঘ্রই কল করে অর্ডার কনফার্ম করবেন।</p>
    <p class="hint" data-i18n="ty.hint">অনুগ্রহ করে ফোনটি কাছে রাখুন। দ্রুত কনফার্ম করতে চাইলে WhatsApp-এ মেসেজ দিন।</p>

    <div style="display:grid;gap:12px;margin-top:20px">
      <a class="btn wa block" href="#" data-wa-order data-i18n="ty.wa">WhatsApp-এ অর্ডার কনফার্ম করুন</a>
      <a class="btn outline block" href="index.html" data-i18n="ty.home">হোমপেজে ফিরে যান</a>
    </div>
  </div>
</main>

<script src="i18n.js"></script>
<script src="config.js"></script>
<script src="shop.js" defer></script>
</body>
</html>
