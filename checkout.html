<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Checkout | Bakaina</title>
<script>
  // The checkout now lives in the storefront (same design as every page). Keep ?product=…&qty=… from the belt page.
  (function () { var q = new URLSearchParams(location.search), o = new URLSearchParams({ view: 'checkout' });
    if (q.get('product')) { o.set('product', q.get('product')); o.set('qty', q.get('qty') || '1'); }
    location.replace('./?' + o.toString()); })();
</script>
<meta http-equiv="refresh" content="0; url=./?view=checkout">
</head>
<body><p><a href="./?view=checkout">Continue to checkout</a></p></body>
</html>
