<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>Bakaina</title>
<script>
(function () { var q = new URLSearchParams(location.search), o = new URLSearchParams(), map = { skincare: 'beauty', bodycare: 'beauty', haircare: 'beauty', appliance: 'appliances', household: 'kitchen' };
  var v = q.get('view'), cat = q.get('cat');
  if (v === 'wishlist' || v === 'account') o.set('view', v);
  else if (cat) { o.set('view', 'cat'); o.set('c', map[cat] || cat); }
  else { o.set('view', 'list'); ['q', 'sale', 'tag'].forEach(function (k) { if (q.get(k)) o.set(k, q.get(k)); }); }
  location.replace('./?' + o.toString()); })();
</script>
<meta http-equiv="refresh" content="0; url=./">
</head>
<body><p><a href="./">Go to Bakaina</a></p></body>
</html>
